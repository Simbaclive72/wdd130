<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact">

    <header>
        <img src="images/logo.png" alt="Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 River Road, Phoenix, AZ</p>
            <p>📞 (602) 555-1234</p>
            <p>📧 info@raftingadventures.com</p>
        </section>

        <section class="contact-grid">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3327.849504209012!2d-112.0740376848009!3d33.44837628077345!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x872b0d0b4b9b4f31%3A0xf09bb4a6e9c4c5c1!2sPhoenix%2C%20AZ!5e0!3m2!1sen!2sus!4v1707000000000"
                  allowfullscreen loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">
                <h2>Send Us a Message</h2>

                <label for="name">Full Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="message">Message</label>
                <textarea id="message" rows="4"></textarea>

                <label>
                    <input type="checkbox"> Subscribe to our newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images contacts/employee1.png" alt="Guide Gabriel">
                    <figcaption>Grabriel – Senior Guide</figcaption>
                </figure>

                <figure>
                    <img src="images contacts/employee2.png" alt="Guide Sarah">
                    <figcaption>Sarah – River Expert</figcaption>
                </figure>

                <figure>
                    <img src="images contacts/employee3.png" alt="Guide Mike">
                    <figcaption>Mike – Safety Lead</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | SimbaClive Musika</p>

        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/twitter.jpg" alt="X"></a>
            <a href="#"><img src="images/instagram.jpg" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
